services:

  postgres:
    image: postgres:17-alpine
    container_name: keycloak-postgres

    restart: unless-stopped

    env_file:
      - ../.env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password

    secrets:
      - postgres_password

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - backend

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    build:
      context: ../docker/keycloak

    container_name: keycloak

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - ../.env

    environment:
      KC_DB: postgres

      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: ${POSTGRES_DB}

      KC_DB_USERNAME: ${POSTGRES_USER}

      KC_DB_PASSWORD_FILE: /run/secrets/postgres_password

      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD_FILE: /run/secrets/keycloak_admin_password

    command:
      - start
      - --import-realm

    secrets:
      - postgres_password
      - keycloak_admin_password

    volumes:
      - ../config/keycloak.conf:/opt/keycloak/conf/keycloak.conf
      - ../config/realms:/opt/keycloak/data/import

    networks:
      - frontend
      - backend

    labels:
      - traefik.enable=true

      - traefik.http.routers.keycloak.rule=Host(`${KEYCLOAK_HOSTNAME}`)

      - traefik.http.routers.keycloak.entrypoints=websecure

      - traefik.http.routers.keycloak.tls.certresolver=letsencrypt

      - traefik.http.services.keycloak.loadbalancer.server.port=8080

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9000/health/ready"
        ]
      interval: 30s
      timeout: 10s
      retries: 5

  traefik:
    image: traefik:v3.3

    container_name: traefik

    restart: unless-stopped

    command:
      - --api.dashboard=true

      - --providers.docker=true

      - --providers.docker.exposedbydefault=false

      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443

      - --certificatesresolvers.letsencrypt.acme.email=admin@example.com

      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json

      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true

      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-data:/letsencrypt

    networks:
      - frontend

volumes:
  postgres-data:
  traefik-data:

networks:
  frontend:
  backend:

secrets:
  postgres_password:
    file: ../secrets/postgres_password.txt

  keycloak_admin_password:
    file: ../secrets/keycloak_admin_password.txt
